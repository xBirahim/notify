<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">notify minimalist logo</title>
  <desc id="desc">Minimal logo for notify: a notification bubble with a command prompt mark and status dot.</desc>

