  <path d="M150 166C150 146.118 166.118 130 186 130H326C345.882 130 362 146.118 362 166V276C362 295.882 345.882 312 326 312H238L184 360V312H186C166.118 312 150 295.882 150 276V166Z" fill="#F8FAFC"/>

