name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Verify source version matches tag
        run: |
          SRC=$(grep 'let appVersion' Sources/notify/Notify.swift | sed 's/.*"\(.*\)".*/\1/')
          TAG="${{ steps.version.outputs.version }}"
          if [ "$SRC" != "$TAG" ]; then
            echo "ERROR: Notify.swift declares $SRC but tag is $TAG"
            exit 1
          fi

      - name: Build & test
        run: swift build -c release && swift test

      - name: Create tarball & compute SHA256
        id: tarball
        run: |
          V="${{ steps.version.outputs.version }}"
          NAME="notify-${V}"
          ARCHIVE="${NAME}.tar.gz"
          git archive --format=tar.gz --prefix="${NAME}/" -o "$ARCHIVE" HEAD
          SHA=$(shasum -a 256 "$ARCHIVE" | awk '{print $1}')
          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA"      >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.tarball.outputs.archive }}" \
            --title "notify ${{ steps.version.outputs.tag }}" \
            --notes "SHA256: \`${{ steps.tarball.outputs.sha256 }}\`" \
            --verify-tag
