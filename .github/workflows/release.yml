name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Extract version from tag
        id: version
        run: |
          TAG="${GITHUB_REF_NAME}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}"  >> "$GITHUB_OUTPUT"

      - name: Verify source version matches tag
        run: |
          SRC=$(grep 'let appVersion' Sources/notify/Notify.swift | sed 's/.*"\(.*\)".*/\1/')
          TAG="${{ steps.version.outputs.version }}"
          if [ "$SRC" != "$TAG" ]; then
            echo "ERROR: Notify.swift declares $SRC but tag is $TAG"
            exit 1
          fi

      - name: Build & test
        run: swift build -c release && swift test

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --title "notify ${{ steps.version.outputs.tag }}" \
            --notes "Homebrew SHA256 will appear below once the release is published." \
            --verify-tag

      - name: Compute SHA256 of GitHub auto-generated tarball
        id: sha256
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          V="${{ steps.version.outputs.version }}"
          URL="https://github.com/xBirahim/notify/archive/refs/tags/${TAG}.tar.gz"
          curl -sL "$URL" -o "notify-${V}.tar.gz"
          SHA=$(shasum -a 256 "notify-${V}.tar.gz" | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "url=$URL"    >> "$GITHUB_OUTPUT"

      - name: Update release notes with SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ steps.sha256.outputs.sha256 }}"
          URL="${{ steps.sha256.outputs.url }}"
          gh release edit "$TAG" --notes "$(printf 'Homebrew formula SHA256 (for \`url \"%s\"\`):\n\n```\n%s\n```' "$URL" "$SHA")"
